<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>iPhone 16</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 30%,#3a3d46,#141519 70%);display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font:inherit}
#wrap{transform-origin:center center}
.phone{width:417px;height:876px;border-radius:68px;padding:12px;position:relative;
  background:linear-gradient(145deg,#4a4c52,#1d1e22 40%,#2c2d31);box-shadow:0 0 0 2px #0b0b0c,0 40px 80px rgba(0,0,0,.6),inset 0 0 3px rgba(255,255,255,.3)}
.btn-side{position:absolute;background:#2a2b2f;border-radius:3px}
.screen{width:393px;height:852px;border-radius:56px;overflow:hidden;position:relative;background:#000;color:#000}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:200;transition:width .35s,height .35s}
.island.wide{width:200px}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:4px 32px 0 48px;
  font-weight:600;font-size:16px;z-index:175;pointer-events:none;color:#fff;transition:color .3s}
.status.dark{color:#000}
.status .icons{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#fff;z-index:180;cursor:pointer}
.homebar.dark{background:#000}
.homebar-hit{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:200px;height:26px;z-index:181;cursor:pointer}

/* ---------- 잠금화면 ---------- */
#lock{position:absolute;inset:0;z-index:120;color:#fff;display:flex;flex-direction:column;align-items:center;transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .5s;user-select:none;touch-action:none}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
#lock .date{margin-top:92px;font-size:20px;font-weight:600;opacity:.9}
#lock .time{font-size:96px;font-weight:700;letter-spacing:-2px;line-height:1.05}
#lock .hint{position:absolute;bottom:40px;font-size:15px;opacity:.85;animation:bob 2s infinite}
#lock .lock-ico{position:absolute;top:58px;font-size:18px}
@keyframes bob{50%{transform:translateY(-6px)}}
.notif-lock{margin-top:30px;width:360px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);border-radius:20px;padding:12px 14px;font-size:14px}
#pass{position:absolute;inset:0;z-index:125;background:rgba(18,18,30,.82);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);color:#fff;display:none;flex-direction:column;align-items:center}
#pass.show{display:flex;animation:fadein .25s}
#pass .t{margin-top:138px;font-size:20px;line-height:1.3;text-align:center;padding:0 22px;word-break:keep-all;font-weight:400}
#pass .dots{display:flex;gap:23px;margin:20px 0 66px;height:13px}
#pass .dots i{width:13px;height:13px;border-radius:50%;border:1.3px solid #fff}
#pass .dots i.on{background:#fff}
#pass .dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pgrid{display:grid;grid-template-columns:repeat(3,75px);gap:19px 25px}
.pgrid button{width:75px;height:75px;border-radius:50%;background:rgba(255,255,255,.62);color:#fff;font-size:38px;font-weight:400;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding-top:2px}
.pgrid button small{font-size:9.5px;letter-spacing:3px;margin-top:1px;font-weight:700;padding-left:3px}
.pgrid button:active{background:rgba(255,255,255,.9)}
#pass .pbtn{position:absolute;bottom:66px;width:110px;text-align:center;font-size:17px}
.island .ii{position:absolute;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .2s}
.island.lockmode{width:172px;height:42px;border-radius:22px}
.island.lockmode .ii{opacity:1}

/* ---------- 홈 화면 ---------- */
#home{position:absolute;inset:0;padding:72px 24px 0;transition:transform .35s,filter .35s}
#home.behind{transform:scale(.92);filter:blur(3px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:24px;justify-items:center}
.app-ico{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:12px;cursor:pointer;position:relative}
.app-ico .ic{width:62px;height:62px;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .15s}
.app-ico:active .ic{transform:scale(.9)}
.badge{position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;min-width:24px;height:24px;border-radius:12px;display:none;align-items:center;justify-content:center;padding:0 7px}
.badge.on{display:flex}
.dock{position:absolute;bottom:22px;left:14px;right:14px;height:96px;border-radius:34px;background:rgba(255,255,255,.25);backdrop-filter:blur(24px);
  display:flex;justify-content:space-around;align-items:center;padding:0 10px}
.dock .app-ico span{display:none}
.hsearch{position:absolute;left:50%;transform:translateX(-50%);bottom:136px;background:rgba(20,20,30,.55);backdrop-filter:blur(20px);color:#fff;font-size:14px;border-radius:15px;padding:6px 14px}
.app-ico span{font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.25)}
#app-calc{background:#000;color:#fff}
.calc-top{position:absolute;top:61px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}
.calc-top button{width:43px;height:43px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 .6px rgba(255,255,255,.14)}
.calc-dw{position:absolute;left:20px;right:22px;top:212px;text-align:right}
.calc-expr{font-size:27px;color:#8e8e93;height:36px;white-space:nowrap;overflow:hidden}
.calc-disp{font-size:72px;font-weight:400;line-height:1.05;white-space:nowrap;letter-spacing:-1px}
.calc-grid{position:absolute;top:341px;left:16px;display:grid;grid-template-columns:repeat(4,84px);gap:8px}
.calc-grid button{width:84px;height:84px;border-radius:50%;font-size:36px;background:#2a2a2c;color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 .6px rgba(255,255,255,.07)}
.calc-grid button.g{background:#5b5b5e}
.calc-grid button.o{background:#f19e39;font-size:42px}
.calc-grid button:active{filter:brightness(1.35)}
#app-generic{background:#fff}
#app-instagram,#app-instagram .page{background:#fff;color:#000}
.ig-top{padding:56px 16px 6px;display:flex;justify-content:space-between;align-items:center}
.ig-top b{font-size:22px;font-weight:700;display:flex;align-items:center;gap:4px}
.ig-top .ics{display:flex;gap:20px}
.ig-prof{display:flex;align-items:center;gap:22px;padding:10px 16px 4px}
.ig-av{border-radius:50%;background:#dbdbdb center/cover;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex-shrink:0}
.ig-stats{flex:1;display:flex;justify-content:space-between;padding-right:10px}
.ig-stats div{display:flex;flex-direction:column;font-size:14px;color:#222}
.ig-stats b{font-size:17px}
.ig-name{padding:6px 16px 0;font-size:14px;font-weight:600}
.ig-bio{padding:2px 16px 0;font-size:14px;white-space:pre-line}
.ig-btns{display:flex;gap:6px;padding:12px 16px}
.ig-btns button{flex:1;height:34px;border-radius:9px;background:#efeff1;font-size:14px;font-weight:600}
.ig-btns button.sm{flex:0 0 36px}
.ig-tabs{display:flex;border-bottom:1px solid #eee;margin-top:4px}
.ig-tabs div{flex:1;display:flex;justify-content:center;padding:10px 0}
.ig-tabs div.on{border-bottom:2px solid #000}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px}
.ig-grid div{aspect-ratio:3/4;background:#eee center/cover;position:relative;cursor:pointer}
.ig-grid div svg{position:absolute;top:8px;right:8px}
.ig-bar{display:flex;justify-content:space-around;align-items:center;padding:10px 0 32px;border-top:1px solid #eee;background:#fff}
.ig-bar button{display:flex}
.ig-hd{padding:56px 12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;background:#fff}
.ig-hd .t{font-weight:700;font-size:16px;flex:1}
.ig-ph{padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.ig-car{position:relative;width:393px;aspect-ratio:3/4;overflow:hidden;background:#000;touch-action:pan-y}
.ig-car .tr{display:flex;height:100%;transition:transform .3s}
.ig-car .tr div{flex:0 0 100%;background:center/cover}
.ig-car .cnt{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:12px;padding:3px 9px}
.ig-dots{display:flex;justify-content:center;gap:4px;padding:8px 0 0;height:14px}
.ig-dots i{width:6px;height:6px;border-radius:50%;background:#ccc}
.ig-dots i.on{background:#0095f6}
.ig-act{display:flex;align-items:center;gap:16px;padding:6px 14px;font-size:14px;font-weight:600}
.ig-act span{display:flex;align-items:center;gap:6px;cursor:pointer}
.ig-cap{padding:2px 14px;font-size:14px}
.ig-date{padding:6px 14px 20px;font-size:12px;color:#888}
.ig-sheet{position:absolute;left:0;right:0;bottom:0;height:72%;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;z-index:5}
.ig-sheet.on{transform:translateY(0)}
.ig-sheet .grab{width:40px;height:4px;border-radius:2px;background:#ccc;margin:8px auto}
.ig-sheet h4{text-align:center;font-size:15px;padding:4px 0 10px;border-bottom:1px solid #eee}
.ig-cm{display:flex;gap:10px;padding:12px 14px;font-size:14px}
.ig-cm .tx{flex:1}
.ig-cm .u{font-size:13px;font-weight:600}.ig-cm .u small{color:#888;font-weight:400;margin-left:6px}
.ig-cm .lk{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#888;gap:2px;cursor:pointer}
.ig-dmrow{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer}
.ig-dmrow .tx{flex:1;font-size:14px}.ig-dmrow .tx div{color:#888;font-size:13px;margin-top:2px}
.ig-msgs{padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.ig-msgs .dt{align-self:center;color:#888;font-size:12px;margin:10px 0}
.ig-msgs .row{display:flex;align-items:flex-end;gap:8px}
.ig-msgs .row.me{justify-content:flex-end}
.ig-msgs .bb{max-width:70%;padding:9px 14px;border-radius:20px;font-size:15px;line-height:1.35;word-break:break-word}
.ig-msgs .them .bb{background:#efeff1}
.ig-msgs .me .bb{background:#7b3cf0;color:#fff}
.ig-in{display:flex;align-items:center;gap:8px;margin:6px 12px 30px;background:#efeff1;border-radius:24px;padding:5px 12px 5px 5px}
.ig-in .cam{width:36px;height:36px;border-radius:50%;background:#7b3cf0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ig-in input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:15px}
.ig-in .send{color:#7b3cf0;font-weight:700;font-size:15px;display:none}
.ig-in .send.on{display:block}
#app-naver{background:#fff}
#app-naver .page{background:#fff}
.nv-top{padding:58px 16px 10px;background:#fff}
.nv-search{height:46px;border:2px solid #03c75a;border-radius:24px;display:flex;align-items:center;gap:8px;padding:0 16px;color:#999;font-size:15px}
.nv-tabs{display:flex;gap:20px;padding:12px 18px 0;border-bottom:1px solid #eee;font-size:15px;color:#666;overflow:hidden}
.nv-tabs span{padding-bottom:10px;white-space:nowrap}
.nv-tabs span.on{color:#111;font-weight:700;border-bottom:2.5px solid #111}
.nv-sec{font-size:17px;font-weight:700;padding:18px 18px 6px}
.nv-item{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid #f2f2f2;cursor:pointer}
.nv-item:active{background:#f7f7f7}
.nv-item .tx{flex:1;min-width:0}
.nv-item .tt{font-size:15.5px;font-weight:600;line-height:1.4;color:#111;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nv-item .mt{font-size:12.5px;color:#999;margin-top:6px}
.nv-thumb{width:86px;height:64px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.3px}
.nv-rank{margin:14px 18px 30px;border:1px solid #eee;border-radius:12px;padding:6px 14px}
.nv-rank div{display:flex;gap:10px;padding:9px 0;font-size:14px;border-bottom:1px solid #f4f4f4;cursor:pointer}
.nv-rank div:last-child{border:none}
.nv-rank b{color:#03c75a;width:14px}
.nv-rank span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv-bar{padding:56px 12px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;font-weight:700;font-size:16px;background:#fff}
.nv-bar button{display:flex;padding:2px 6px}
.nv-art{padding:18px 18px 30px}
.nv-art h1{font-size:22px;line-height:1.38;letter-spacing:-.4px}
.nv-art .meta{font-size:12.5px;color:#999;margin:10px 0 16px;padding-bottom:14px;border-bottom:1px solid #eee}
.nv-art p{font-size:16px;line-height:1.75;color:#222;margin-bottom:14px;word-break:keep-all}
.nv-react{display:flex;justify-content:center;gap:5px;margin:22px 0 8px}
.nv-react button{border:1px solid #e5e5e5;border-radius:18px;padding:6px 9px;font-size:12px;color:#555;white-space:nowrap}
.nv-react button.on{border-color:#03c75a;color:#03c75a}
.nv-cmh{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px;border-top:8px solid #f4f4f4;margin:20px -18px 0;padding-left:18px;padding-right:18px}
.nv-cmh b{font-size:16px}
.nv-cmh span{font-size:13px;color:#999}
.nv-cin{display:flex;gap:8px;margin:8px 0 6px}
.nv-cin input{flex:1;border:1px solid #ddd;border-radius:8px;height:40px;padding:0 12px;font-size:14px;outline:none}
.nv-cin button{background:#03c75a;color:#fff;border-radius:8px;padding:0 14px;font-size:14px;font-weight:600}
.nv-cm{padding:14px 0;border-bottom:1px solid #f2f2f2}
.nv-cm .u{font-size:13px;font-weight:700}
.nv-cm .u small{font-weight:400;color:#aaa;margin-left:6px}
.nv-cm .c{font-size:15px;line-height:1.5;margin:5px 0 8px}
.nv-cm .bt{display:flex;gap:8px;justify-content:flex-end}
.nv-cm .bt button{border:1px solid #e5e5e5;border-radius:4px;padding:3px 8px;font-size:12px;color:#666}
.nv-cm .bt button.on{color:#03c75a;border-color:#03c75a}
.nv-note{font-size:11px;color:#bbb;text-align:center;margin-top:24px}
#app-music{background:#2d2a5e;color:#fff}
#app-music .page{background:linear-gradient(180deg,#34306a 0%,#2b2859 45%,#26234f 100%)}
.mu-top{position:absolute;top:0;left:0;right:0;height:114px;padding:60px 15px 0;display:flex;justify-content:space-between;z-index:3;background:rgba(45,42,94,.6);backdrop-filter:blur(20px);border-bottom:.5px solid rgba(255,255,255,.08)}
.mu-btn{height:42px;min-width:44px;border-radius:21px;background:rgba(10,10,25,.75);display:flex;align-items:center;justify-content:center;gap:26px;padding:0 15px}
.mu-scroll{padding-top:127px;padding-bottom:180px}
.mu-art{width:260px;height:260px;border-radius:10px;margin:0 auto;display:block;box-shadow:0 12px 30px rgba(0,0,0,.35);object-fit:cover}
.mu-title{text-align:center;font-size:20px;font-weight:700;margin-top:22px}
.mu-artist{text-align:center;font-size:17px;margin-top:4px;color:#f2f2f7}
.mu-meta{text-align:center;font-size:12px;margin-top:6px;color:#b9b4ea;font-weight:600}
.mu-ctrl{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0 22px}
.mu-circ{width:47px;height:47px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.mu-play{width:156px;height:47px;border-radius:24px;background:#fff;color:#3b3670;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.mu-tracks{margin:0 20px;border-top:.5px solid rgba(255,255,255,.18);border-bottom:.5px solid rgba(255,255,255,.18)}
.mu-tr{display:flex;align-items:center;height:48px;cursor:pointer;position:relative}
.mu-tr + .mu-tr .mu-tt{border-top:.5px solid rgba(255,255,255,.18)}
.mu-tr .no{width:28px;color:#a9a4d8;font-size:15px;text-align:center;flex-shrink:0}
.mu-tr .mu-tt{flex:1;height:100%;display:flex;align-items:center;justify-content:space-between;font-size:15px;margin-left:8px}
.mu-tr .mu-tt span:last-child{color:#d6d3f2;letter-spacing:1px;padding:0 4px}
.mu-tr .dot{position:absolute;left:-12px;width:6px;height:6px;border-radius:50%;background:#a9a4d8;display:none}
.mu-tr.cur .dot{display:block}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:#ff375f;animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
.eq.paused i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.mu-foot{margin:14px 20px;font-size:14px;line-height:1.45;color:#9d98cc;white-space:pre-line}
.mu-mini{position:absolute;left:20px;right:20px;bottom:104px;height:55px;border-radius:28px;background:rgba(18,16,40,.88);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 16px 0 13px;gap:10px;z-index:3;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.mu-mini img{width:30px;height:30px;border-radius:5px;object-fit:cover}
.mu-mini .tx{flex:1;min-width:0;font-size:13px;line-height:1.2}
.mu-mini .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mu-mini button{padding:4px 6px}
.mu-tabs{position:absolute;left:20px;right:20px;bottom:22px;height:62px;border-radius:31px;background:rgba(18,16,40,.92);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 5px;z-index:3}
.mu-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;height:52px;justify-content:center;border-radius:26px;color:#fff}
.mu-tabs button.on{background:#0b0a18;color:#ff375f;flex:1.25}
.gen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#8e8e93;font-size:15px}
.widget{grid-column:span 2;width:100%;height:155px;border-radius:22px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);color:#fff;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.widget .big{font-size:40px;font-weight:300}

/* ---------- 앱 공통 ---------- */
.app{position:absolute;inset:0;background:#fff;z-index:100;transform:scale(.2);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,.9,.3,1),opacity .25s;border-radius:56px;overflow:hidden}
.app.open{transform:scale(1);opacity:1;pointer-events:auto}
.page{position:absolute;inset:0;background:inherit;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.page.sub{transform:translateX(100%);box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.page.sub.in{transform:translateX(0)}
.page.base.out{transform:translateX(-30%)}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.bigtitle{font-size:34px;font-weight:700;padding:62px 18px 8px}
.search{margin:0 16px 10px;background:#eeeef0;border-radius:11px;height:38px;display:flex;align-items:center;padding:0 10px;color:#8e8e93;font-size:16px;gap:6px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;background-size:cover;background-position:center}

/* ---------- 메시지 (iMessage) ---------- */
#app-sms{background:#fff}
.thread{display:flex;gap:12px;padding:10px 16px;align-items:center;cursor:pointer}

<script>
/* ============ 유틸 ============ */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s).toLowerCase().replace(/\s+/g, "");
const contact = id => CONFIG.contacts.find(c => c.id === id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
// mode "kakao" = 카톡 프사 / 그 외 = 전화번호부(사진 없이 이니셜)
function avatar(c, size, mode) {
  const a = el("div", "avatar");
  a.style.width = a.style.height = size + "px";
  const PHOTOS = { MY_PHOTO, HANEUL_PHOTO, SUNGHOON_PHOTO, CAT_PHOTO, LANDSCAPE_PHOTO };
  if (mode === "kakao") {
    if (c && c.photo) { a.style.backgroundImage = `url("${PHOTOS[c.photo] || c.photo}")`; }
    else {
      a.style.background = "#a9c9e8";
      a.innerHTML = `<svg width="${size * .5}" height="${size * .5}" viewBox="0 0 24 24" fill="#d6e6f6"><circle cx="12" cy="8.5" r="4.6"/><path d="M3.5 21c0-4.6 3.8-7.3 8.5-7.3s8.5 2.7 8.5 7.3z"/></svg>`;
    }
  } else {
    a.style.background = "linear-gradient(#a9adb7,#868a94)";
    a.style.fontSize = (size * 0.42) + "px";
    a.textContent = c ? c.name.replace(/[^\p{L}\p{N}]/gu, "")[0] || "?" : "?";
  }
  return a;
}
const sortedContacts = () => [...CONFIG.contacts].sort((a, b) => a.name.localeCompare(b.name, "ko"));
function nowTime(d = new Date()) {
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0");
  return `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${m}`;
}
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
const hm24 = d => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

/* ============ 대화 저장소 & 답장 엔진 ============ */
const chats = { sms: {}, kakao: {} };  // chats[app][id] = {msgs:[], unread:0, used:Set}
let openChat = null; // {app, id}
function initChats() {
  for (const app of ["sms", "kakao"]) for (const id in CONFIG[app]) {
    const cfg = CONFIG[app][id], h = cfg.history || [];
    let curDate = null, i = 0; const start = Date.now() - 1000 * 60 * 60, msgs = [];
    for (const e of h) {
      if (e.date && e.me == null && e.them == null && e.text == null) { curDate = e.date; continue; }
      const from = e.from || (e.me != null ? "me" : "them");  // who: 단톡에서 보낸 사람
      const text = e.text ?? e.me ?? e.them;
      const t = curDate && e.time ? new Date(`${curDate}T${e.time}:00`) : new Date(start + (i++) * 60000);
      msgs.push({ from, who: e.who, text, type: e.type, t, read: e.read !== false });
    }
    chats[app][id] = { msgs, unread: cfg.unread || 0, used: new Set() };
  }
  updateBadges();
}
function findReply(app, id, text) {
  const cfg = CONFIG[app][id]; if (!cfg) return null;
  const t = norm(text), st = chats[app][id];
  for (let i = 0; i < (cfg.replies || []).length; i++) {
    const r = cfg.replies[i];
    if (r.once && st.used.has(i)) continue;
    if (r.keywords.some(k => t.includes(norm(k)))) { st.used.add(i); if (r.block) st.blockNext = true; return [].concat(r.reply); }
  }
  return cfg.fallback && cfg.fallback.length ? [pick(cfg.fallback)] : null;
}
async function sendMessage(app, id, text) {
  const st = chats[app][id] || (chats[app][id] = { msgs: [], unread: 0, used: new Set() });
  const mine = { from: "me", text, t: new Date(), read: false };
  st.msgs.push(mine); render(app, id);
  if (st.blocked) return;            // 차단됨: 안 읽고 답장 없음
  if ((CONFIG[app][id] || {}).readMessages === false) return;  // 안 읽는 사람
  const replies = findReply(app, id, text);
  if (st.blockNext) { st.blocked = true; st.blockNext = false; }
  await sleep(900 + Math.random() * 900);
  mine.read = true; render(app, id);
  if (!replies) return;
  for (const r of replies) {
    await sleep(500);
    setTyping(app, id, true);
    await sleep(700 + Math.min(r.length * 70, 2500));
    setTyping(app, id, false);
    st.msgs.push({ from: "them", text: r, t: new Date() });
    const viewing = openChat && openChat.app === app && openChat.id === id;
    if (!viewing) { st.unread++; showBanner(app, id, r); }
    render(app, id);
  }
}
const typingState = {};
function setTyping(app, id, on) { typingState[app + id] = on; render(app, id); }
function render(app, id) {
  if (app === "sms") { renderSmsList(); if (openChat && openChat.app === "sms" && openChat.id === id) renderSmsChat(id); }
  else { renderKakaoLists(); if (openChat && openChat.app === "kakao" && openChat.id === id) renderKakaoChat(id); }
  updateBadges();
}
function updateBadges() {
  const live = {
    sms: Object.values(chats.sms).reduce((a, s) => a + s.unread, 0),
    kakao: Object.values(chats.kakao).reduce((a, s) => a + s.unread, 0),
    phone: callLog.filter(c => c.missed && !c.seen).length,

  for (const k in ICONS) {

}

function showBanner(app, id, text) {

  const post = () => { const v = inp.value.trim(); if (!v) return; const c = { user: "jjon****", time: "방금", text: v, like: 0, hate: 0 }; a.comments.unshift(c); addCm(c, true); inp.value = ""; };
  send.onclick = post; inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) post(); });
  cin.append(inp, send); box.append(cin, cms);

/* ============ 음악 ============ */
const mu = { idx: CONFIG.music.tracks.length - 1, playing: false };
const PLAY_SVG = `<svg width="22" height="24" viewBox="0 0 14 16" fill="#fff"><path d="M1 1.5v13a1 1 0 0 0 1.5.9l10.6-6.5a1 1 0 0 0 0-1.8L2.5.6A1 1 0 0 0 1 1.5z"/></svg>`;
const PAUSE_SVG = `<svg width="20" height="22" viewBox="0 0 20 22" fill="#fff"><rect x="2" y="1" width="5.5" height="20" rx="1.5"/><rect x="12.5" y="1" width="5.5" height="20" rx="1.5"/></svg>`;

/* ============ 계산기 ============ */
// 내부 표기: "−" = 빼기, "-" = 음수 부호
const calc = { expr: (CONFIG.calcStart || {}).expr || "", result: (CONFIG.calcStart || {}).result || "0", done: !!CONFIG.calcStart };
const BACK_SVG = `<svg width="38" height="26" viewBox="0 0 38 26" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2h22a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H12L2 13z"/><path d="m17 8 10 10M27 8 17 18"/></svg>`;
const PM_SVG = `<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 9h10M8 4v10M23 4 11 30M21 26h11"/></svg>`;
function buildCalc() {
  const keys = [["⌫","g"],["AC","g"],["%","g"],["÷","o"],["7"],["8"],["9"],["×","o"],["4"],["5"],["6"],["−","o"],["1"],["2"],["3"],["+","o"],["±"],["0"],["."],["=","o"]];
  keys.forEach(([k, c]) => {
    const b = el("button", c || "");
    if (k === "⌫") b.innerHTML = BACK_SVG; else if (k === "±") b.innerHTML = PM_SVG; else b.textContent = k;
    if (k === "AC") b.style.fontSize = "34px";
    b.onclick = () => calcKey(k); $("calc-grid").appendChild(b);
  });
  calcShow();
}
const isOp = ch => "+−×÷".includes(ch);
function fmtNum(n) {
  if (!isFinite(n)) return "오류";
  const r = Math.round(n * 1e10) / 1e10;
  if (Math.abs(r) >= 1e15) return r.toExponential(4);
  return r.toLocaleString("en-US", { maximumFractionDigits: 8 });
}
function calcEval(e) {
  while (e && (isOp(e.slice(-1)) || e.slice(-1) === "-")) e = e.slice(0, -1);
  if (!e) return 0;
  const js = e.replace(/,/g, "").replace(/×/g, " * ").replace(/÷/g, " / ").replace(/−/g, " - ");
  if (!/^[0-9.\s+\-*/]+$/.test(js)) return NaN;
  try { return Function(`"use strict";return (${js})`)(); } catch { return NaN; }
}
function calcShow() {
  const main = calc.done ? calc.result : (calc.expr || "0");
  $("calc-expr").textContent = calc.done ? calc.expr : "";
  const d = $("calc-disp"); d.textContent = main.replace(/-/g, "-");
  d.style.fontSize = main.length > 13 ? "38px" : main.length > 10 ? "48px" : main.length > 7 ? "60px" : "72px";
}
function lastNum(e) { const m = e.match(/-?[0-9.]+$/); return m ? m[0] : ""; }
function calcKey(k) {
  if (/^[0-9]$/.test(k)) {
    if (calc.done) { calc.expr = ""; calc.done = false; }
    if (lastNum(calc.expr).replace(/[-.]/g, "").length >= 9) return;
    if (/(^|[+−×÷])-?0$/.test(calc.expr)) calc.expr = calc.expr.slice(0, -1);
    calc.expr += k;
  } else if (k === ".") {
    if (calc.done) { calc.expr = ""; calc.done = false; }
    const n = lastNum(calc.expr);
    if (n.includes(".")) return;
    calc.expr += n && n !== "-" ? "." : "0.";
  } else if (isOp(k)) {
    if (calc.done) { calc.expr = calc.result === "오류" ? "0" : calc.result.replace(/,/g, ""); calc.done = false; }
    if (!calc.expr) calc.expr = "0";
    if (isOp(calc.expr.slice(-1))) calc.expr = calc.expr.slice(0, -1);
    calc.expr += k;
  } else if (k === "=") {
    if (calc.done || !calc.expr) return;
    calc.result = fmtNum(calcEval(calc.expr)); calc.done = true;
  } else if (k === "AC") {
    calc.expr = ""; calc.result = "0"; calc.done = false;
  } else if (k === "⌫") {
    if (calc.done) return;
    calc.expr = calc.expr.slice(0, -1);
  } else if (k === "%" || k === "±") {
    if (calc.done) { calc.expr = calc.result.replace(/,/g, ""); calc.done = false; }
    const n = lastNum(calc.expr); if (!n || n === "-") return;
    const head = calc.expr.slice(0, calc.expr.length - n.length);
    const nn = k === "%" ? String(Math.round(parseFloat(n) / 100 * 1e10) / 1e10) : (n.startsWith("-") ? n.slice(1) : "-" + n);
    calc.expr = head + nn;
  }
  calcShow();
}
